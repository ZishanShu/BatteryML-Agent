# LEGACY EXAMPLE — not the SOH estimation task.
#
# This config demonstrates label plumbing with DummyRULPredictor
# (sklearn DummyRegressor, which predicts the training mean), one
# label per cell at a single cycle, and RUL features from earlier
# cycles. The canonical cycle-level SOH route uses
# CycleSOHLabelAnnotator; see docs/SOH_PROTOCOL.md.
legacy_example: true
model:
    name: 'DummyRULPredictor'
train_test_split:
    name: 'MATRPrimaryTestTrainTestSplitter'
    cell_data_path: 'data/processed/MATR'
feature:
    name: 'VarianceModelFeatureExtractor'
    interp_dims: 1000
    critical_cycles:
        - 2
        - 9
        - 99
    use_precalculated_qdlin: True
label:
    name: 'SOHLabelAnnotator'
    cycle_index: 300
    reference_capacity_mode: 'first_valid_discharge_capacity'
    # soh_filepath: data/exaple_qd_map.json 
feature_transformation:
    name: 'ZScoreDataTransformation'
label_transformation:
    name: 'SequentialDataTransformation'
    transformations:
        - name: 'LogScaleDataTransformation'
        - name: 'ZScoreDataTransformation'
