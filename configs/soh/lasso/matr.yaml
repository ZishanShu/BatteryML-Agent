# MATR SOH estimation — Lasso regression.
#
# One of the compatible SOH baselines. Everything below the `model:` block is
# byte-identical to configs/soh/ridge/matr.yaml on purpose: same dataset, same
# cell-level split, same reference-capacity convention, same sample policy,
# same feature extractor, same transformations. Only the estimator differs, so
# two SOH results differ only by the estimator. See docs/SOH_PROTOCOL.md.
#
# This is model coverage, not a benchmark. No hyperparameter here was chosen
# by looking at a score.

task: 'SOH estimation'

model:
    # sklearn.linear_model.LassoCV via the extension model in
    # batteryml_web/models/lasso.py. The RUL in the class name is naming only:
    # SklearnModel.fit is model.fit(feature.view(n, -1), label) with no
    # lifetime, end-of-life or cycle semantics. Displayed as "Lasso Regression".
    #
    # Pure L1, the l1_ratio = 1 corner of the same penalized-linear family as
    # Ridge (pure L2). Being pure L1 it drives coefficients to exactly zero, so
    # it is the member that selects a subset of the 37 feature dimensions
    # rather than shrinking all of them — which on a resampled voltage curve
    # amounts to selecting which parts of the curve carry the health signal.
    #
    # No hyperparameters are declared, so LassoCV's defaults apply: the penalty
    # is chosen by internal 5-fold cross-validation over an automatic alpha
    # path. That CV runs inside the training split only — it never sees a test
    # cell — but note that fitting is itself cross-validated.
    #
    # Reproducibility: LassoCV's default coordinate-descent selection is
    # 'cyclic', not 'random', and its default KFold does not shuffle, so the
    # fit carries no stochastic component. Two runs at the same seed agree
    # exactly. [VERIFIED] — measured in this container on a synthetic bundle of
    # the same width, not on MATR.
    #
    # NOTE: this is an extension model. It registers only through
    # batteryml_web/core/run_batteryml_cli.py, which is the wrapper CLAUDE.md
    # §5 requires for every invocation anyway. bin/batteryml.py alone would
    # raise `KeyError: LassoRULPredictor is not registered to Models!`.
    name: 'LassoRULPredictor'

train_test_split:
    # Cell-level. Cells are partitioned by explicit ID before any expansion
    # into cycle-level samples; Task.build asserts the two sides share no cell.
    name: 'MATRPrimaryTestTrainTestSplitter'
    cell_data_path: 'data/processed/MATR'

feature:
    # The voltage curve observed at cycle t, resampled to a fixed width plus
    # five summary scalars. Reads cycles <= t only, and never capacity: the
    # label is capacity / Q_ref, so capacity as a feature would make the target
    # an arithmetic function of the input.
    name: 'SOHVoltageCurveFeatureExtractor'
    n_voltage_points: 32
    n_history_cycles: 1
    include_cycle_number: false

label:
    # SOH(cell, t) = Q_discharge(cell, t) / Q_ref(cell), a ratio.
    name: 'CycleSOHLabelAnnotator'
    reference_capacity_mode: 'first_valid_discharge_capacity'
    min_cycle: 10
    max_cycle: null
    cycle_stride: 5

feature_transformation:
    # Voltage values and durations are on very different scales, and an L1
    # penalty is applied to the raw coefficients, so an unstandardised feature
    # would be penalised in proportion to its units rather than its
    # contribution. Standardising is required here, not a preference.
    name: 'ZScoreDataTransformation'

label_transformation:
    # Invertible, and DataBundle.evaluate inverse-transforms before scoring, so
    # the recorded MAE and RMSE are on the canonical SOH ratio scale.
    # LogScale is deliberately NOT stacked here as it is for RUL: a log of a
    # ratio near 1.0 compresses exactly the range SOH lives in, and is
    # undefined at 0.
    name: 'ZScoreDataTransformation'
